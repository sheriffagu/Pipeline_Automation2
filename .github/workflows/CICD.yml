name: CICd Workflow for Maven build and Sonar Code scan

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name:  Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: '11'
          cache: maven
          cache-dependency-path: MyWebApp/pom.xml

      - name: Build with Maven
        run: mvn clean install -f MyWebApp/pom.xml
      - name: javoco coverage
        run: mvn clean verify -f MyWebApp/pom.xml 
      - name: SonarQube Scan with Quality Gate
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_PASSWORD }}
        run: mvn -f MyWebApp/pom.xml org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=MyWebApp -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.qualitygate.wait=true
      -  name: Upload artifact to Nexus
        env: 
          nexus_url: ${{ secrets.NEXUS_URL }} 
          nexus_username: ${{ secrets.NEXUS_USERNAME }} 
          nexus_password: ${{ secrets.NEXUS_PASSWORD }} 
          nexus-repository: "maven-snapshots"
          artifact-path: "MyWebApp/target/myWebApp.war"
          artifact-format: "maven"
          artifact-group-id: "com.dept.app"
          artifact-id: "MyWebApp"
          artifact-version: "1.0-SNAPSHOT"

