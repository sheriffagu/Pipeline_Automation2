name: CICd Workflow for Maven build and Sonar Code scan

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name:  Set up JDK 11
        uses: actions/setup-java@v2
        with:
          distribution: 'adopt'
          java-version: '11'
          cache: maven
          cache-dependency-path: MyWebApp/pom.xml

      - name: Build with Maven
        run: mvn clean install -f MyWebApp/pom.xml

      - name: SonarQube Scan with Quality Gate
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_PASSWORD }}
        run: 
          mvn -f MyWebApp/pom.xml
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=MyWebApp
          -Dsonar.projectName=MyWebApp
          -Dsonar.host.url="$SONAR_HOST_URL"
          -Dsonar.qualitygate.wait=true
